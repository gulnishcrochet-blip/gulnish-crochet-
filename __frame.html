<script>
var got={};
addEventListener("message",function(e){
  if(!e.data||e.data.p!=="__PAGE__")return;
  var d=e.data.r;
  var bad=[];
  if(d.hscroll)bad.push("HSCROLL "+d.scrollW+"/"+d.innerW);
  if(d.overflowers.length)bad.push("OVERFLOW "+JSON.stringify(d.overflowers));
  if(d.small.length)bad.push("SMALL "+JSON.stringify(d.small));
  if(bad.length)got.__bad=(got.__bad||[]).concat([bad]);
});
setTimeout(function(){
  var n=11;
  var keys=Object.keys(got).filter(function(k){return k!=="__bad"});
  document.title="RESULT"+JSON.stringify({
    w:768,h:1024,
    pagesReported:keys.length,pagesTotal:n,
    problems:got.__bad||[]
  });
},13000);
</script>

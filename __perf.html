<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>hidden image audit</title></head>
<body>
<iframe id="f" src="products.html" style="width:390px;height:844px;border:0"></iframe>
<pre id="out">waiting</pre>
<script>
document.getElementById("f").addEventListener("load", function(){
  var w = this.contentWindow, d = this.contentDocument;
  setTimeout(function(){
    var cards = [].slice.call(d.querySelectorAll("[data-category]"));
    var hidden = cards.filter(function(c){return c.classList.contains("is-hidden");});
    var shown  = cards.filter(function(c){return !c.classList.contains("is-hidden");});
    var imgs = [].slice.call(d.getElementById("productGrid").querySelectorAll("img"));
    var loaded = imgs.filter(function(i){return i.complete && i.naturalWidth>0;});
    var loadedHidden = imgs.filter(function(i){
      var c = i.closest("[data-category]");
      return c && c.classList.contains("is-hidden") && i.complete && i.naturalWidth>0;
    });
    var kb = w.performance.getEntriesByType("resource")
      .filter(function(r){return r.initiatorType==="img";})
      .reduce(function(a,r){return a+(r.transferSize||0);},0)/1024;
    var L=[];
    L.push("cards total: "+cards.length+"   shown: "+shown.length+"   hidden: "+hidden.length);
    L.push("img elements in grid: "+imgs.length+"   successfully loaded: "+loaded.length);
    L.push(">>> loaded images belonging to HIDDEN cards: "+loadedHidden.length);
    L.push(">>> WASTED image bytes: "+Math.round(kb)+"KB");
    L.push("hidden card sample: "+(hidden[0]?hidden[0].querySelector("img").src.split("/").slice(-2).join("/")+" complete="+hidden[0].querySelector("img").complete+" nat="+hidden[0].querySelector("img").naturalWidth:"none"));
    // is display:none actually applied?
    var h0 = hidden[0];
    L.push("hidden card display: "+(h0?getComputedStyle(h0).display:"-"));
    L.push("hidden card img loading attr: "+(h0?h0.querySelector("img").getAttribute("loading"):"-"));
    document.getElementById("out").textContent = L.join("\n");
  }, 5000);
});
</script></body></html>

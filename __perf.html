<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>footer verify</title>
<style>html,body{margin:0}iframe{border:0;display:block}</style></head>
<body>
<iframe id="f" src="index.html" style="width:390px;height:844px"></iframe>
<pre id="out" style="font:11px/1.5 monospace"></pre>
<script>
document.getElementById("f").addEventListener("load",function(){
  var w=this.contentWindow,d=this.contentDocument,L=[];
  setTimeout(function(){
    var f=d.querySelector(".site-footer");
    var bn=d.querySelector(".bottom-nav");
    L.push("=== 390px ===");
    L.push("footer height: "+Math.round(f.getBoundingClientRect().height)+"px");

    // scroll to the very bottom and see what the fixed nav hides
    w.scrollTo(0,d.body.scrollHeight);
    setTimeout(function(){
      var bottom=f.querySelector(".footer-bottom").getBoundingClientRect();
      var navTop=bn.getBoundingClientRect().top;
      L.push("");
      L.push("after scrolling to the bottom:");
      L.push("  footer-bottom rect: top="+Math.round(bottom.top)+" bottom="+Math.round(bottom.bottom));
      L.push("  bottom-nav rect:    top="+Math.round(navTop));
      L.push("  copyright visible above nav: "+(bottom.bottom<=navTop?"YES":"NO  <-- COVERED"));
      L.push("  body padding-bottom: "+w.getComputedStyle(d.body).paddingBottom);

      // overflow check: any element wider than the viewport?
      L.push("");
      var over=[].slice.call(f.querySelectorAll("*")).filter(function(el){
        var b=el.getBoundingClientRect();
        return b.width>0 && (b.right>391||b.left<-1);
      });
      L.push("elements overflowing horizontally: "+over.length);
      over.slice(0,6).forEach(function(el){
        var b=el.getBoundingClientRect();
        L.push("    "+el.tagName+"."+String(el.className).split(" ")[0]+
               " right="+Math.round(b.right)+" w="+Math.round(b.width));
      });

      // tap targets
      var links=[].slice.call(f.querySelectorAll("a"));
      var small=links.filter(function(a){
        var b=a.getBoundingClientRect();
        return b.width>0&&b.height>0&&b.height<44;});
      L.push("");
      L.push("footer links under 44px tall: "+small.length);
      small.slice(0,6).forEach(function(a){
        L.push("    '"+a.textContent.trim().slice(0,20)+"' "+Math.round(a.getBoundingClientRect().height)+"px");
      });

      // wrapped-line check: compare the text box against the row, not height
      // (a 44px flex tap target is taller than 1.7 line-heights by design)
      L.push("");
      var wrapped=[].slice.call(f.querySelectorAll(".footer-links a, .footer-shoplist a")).filter(function(a){
        var range=d.createRange(); range.selectNodeContents(a);
        var r=range.getBoundingClientRect();
        var box=a.getBoundingClientRect();
        return r.height>24;   // more than one line of ~20px text
      });
      L.push("links whose text wraps to 2+ lines: "+wrapped.length+
             (wrapped.length?"  <-- tight":"  (ok)"));
      wrapped.slice(0,6).forEach(function(a){
        L.push("    '"+a.textContent.trim()+"'");
      });
      document.getElementById("out").textContent=L.join("\n");
    },700);
  },6000);
});
</script></body></html>

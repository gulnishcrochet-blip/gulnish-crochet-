<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<pre id="out">x</pre>
<script>
var widths=[1280,1440],L=[],i=0;
function next(){
 if(i>=widths.length){document.getElementById("out").textContent=L.join("\n");return;}
 var px=widths[i++];
 var f=document.createElement("iframe");
 f.style.cssText="width:"+px+"px;height:900px;border:0";f.src="index.html";
 f.onload=function(){
  setTimeout(function(){
   var d=this.contentDocument;
   var ftr=d.querySelector(".site-footer");
   var cols=[].slice.call(ftr.querySelectorAll(".footer-col,.footer-brand")).map(function(c){
     return c.className.split(" ")[0]+":"+Math.round(c.getBoundingClientRect().width);});
   var sameRow=Math.abs(
     ftr.querySelector(".footer-brand").getBoundingClientRect().top -
     ftr.querySelector(".footer-col").getBoundingClientRect().top)<4;
   L.push(px+"px (desktop): footerH="+Math.round(ftr.getBoundingClientRect().height)+
     "  allColsOnOneRow="+(sameRow?"yes (unchanged 4-col)":"NO  <-- REGRESSION")+
     "\n           widths=["+cols.join(" ")+"]");
   f.remove();next();
  }.bind(this),5000);
 };
 document.body.appendChild(f);
}
next();
</script></body></html>

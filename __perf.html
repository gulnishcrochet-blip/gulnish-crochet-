<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>srcset probe</title></head>
<body>
<iframe id="f" src="products.html" style="width:390px;height:844px;border:0"></iframe>
<pre id="out">waiting</pre>
<script>
document.getElementById("f").addEventListener("load", function(){
  var w=this.contentWindow,d=this.contentDocument,L=[];
  setTimeout(function(){
    // For each visible card, compare the srcset against the real file widths.
    var probe=["bouquet-1.webp","purse-1.webp","bag-1.webp","keychain-1.webp","bag-3.webp"];
    var out=[];
    probe.forEach(function(name){
      var im=d.querySelector('img[srcset*="'+name+'"]') ||
             d.querySelector('img[data-srcset*="'+name+'"]');
      if(!im){ out.push(name+": (no card in view)"); return; }
      var ss=im.getAttribute("srcset")||im.getAttribute("data-srcset")||"";
      var sizes=im.getAttribute("sizes")||im.getAttribute("data-sizes")||"";
      out.push(name+"\n    srcset: "+ss+"\n    sizes:  "+sizes);
    });
    // Count any srcset entry that points at a missing file (a 404 waiting to happen)
    var all=0,bad=0;
    [].slice.call(d.querySelectorAll("img")).forEach(function(im){
      var ss=im.getAttribute("srcset")||im.getAttribute("data-srcset")||"";
      if(!ss) return; all++;
      var d2=ss.split(",").map(function(p){return p.trim().split(" ")[0];});
      if(d2.some(function(u){return u.indexOf("images/sm/")===0 && u.indexOf("og-")===0;})) bad++;
    });
    L=out.concat(["","imgs with a srcset: "+all+"  suspicious: "+bad,
      "browser-picked currentSrc of first visible main img:",
      "    "+(d.querySelector(".work-card__main[src]")||{currentSrc:"none"}).currentSrc]);
    document.getElementById("out").textContent=L.join("\n");
  },5000);
});
</script></body></html>

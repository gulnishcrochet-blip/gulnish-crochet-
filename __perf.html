<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>rule finder</title></head>
<body>
<iframe id="f" src="index.html" style="width:390px;height:844px;border:0"></iframe>
<pre id="out">waiting</pre>
<script>
document.getElementById("f").addEventListener("load",function(){
  var w=this.contentWindow,d=this.contentDocument,L=[];
  setTimeout(function(){
    var b=d.getElementById("cartClose");
    L.push("tagName: "+b.tagName+"  class: "+b.className);
    L.push("inline style attr: '"+b.getAttribute("style")+"'");
    var chain=[],n=b;
    while(n&&n!==d.documentElement){chain.push(n.tagName+(n.id?"#"+n.id:"")+(n.className?"."+String(n.className).split(" ").join("."):""));n=n.parentElement;}
    L.push("ancestors: "+chain.join(" < "));
    L.push("");
    L.push("computed display: "+w.getComputedStyle(b).display);
    L.push("computed visibility: "+w.getComputedStyle(b).visibility);
    L.push("offsetParent: "+(b.offsetParent?b.offsetParent.tagName:"null"));
    L.push("getBoundingClientRect: "+JSON.stringify(b.getBoundingClientRect()));
    L.push("");
    L.push("=== stylesheet rules mentioning cart-drawer__close or cart-drawer ===");
    var rules=[];
    [].slice.call(d.styleSheets).forEach(function(sheet){
      var rs; try{rs=sheet.cssRules;}catch(e){L.push("(blocked: "+sheet.href+")");return;}
      [].slice.call(rs).forEach(function(r){
        if(r.cssRules){[].slice.call(r.cssRules).forEach(function(rr){
          if(rr.selectorText&&/cart-drawer/.test(rr.selectorText)&&/visibility|display/.test(rr.cssText))
            rules.push("@media "+r.conditionText+" { "+rr.selectorText+" { "+rr.style.cssText+" } }");
        });}
        else if(r.selectorText&&/cart-drawer/.test(r.selectorText)&&/visibility|display/.test(r.cssText))
          rules.push(r.selectorText+" { "+r.style.cssText+" }");
      });
    });
    L.push(rules.length?rules.join("\n"):"(no rule sets display or visibility)");
    document.getElementById("out").textContent=L.join("\n");
  },3500);
});
</script></body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>a11y probe</title></head>
<body>
<iframe id="f" src="index.html" style="width:390px;height:844px;border:0"></iframe>
<pre id="out">waiting</pre>
<script>
document.getElementById("f").addEventListener("load", function(){
  var w=this.contentWindow,d=this.contentDocument,L=[];
  function who(){var e=d.activeElement;if(!e)return"none";return e.id||e.className||e.tagName;}
  setTimeout(function(){
    var btn=d.getElementById("bottomNavCart");
    var drawer=d.getElementById("cartDrawer");
    var closeBtn=d.getElementById("cartClose");
    L.push("focus before open: "+who());
    btn.click();
    setTimeout(function(){
      L.push("focus 60ms after open: "+who());
      L.push("close btn computed visibility: "+w.getComputedStyle(closeBtn).visibility);
      L.push("FOCUS IS INSIDE DRAWER: "+(drawer.contains(d.activeElement)?"YES  (fixed)":"NO  <-- STILL BROKEN"));
      L.push("aria-expanded: "+btn.getAttribute("aria-expanded")+"  drawer aria-hidden: "+drawer.getAttribute("aria-hidden"));
      // tab order: close button should be reachable
      closeBtn.focus();
      L.push("closeBtn.focus() -> activeElement: "+who());
      // reopen then Escape
      btn.click(); setTimeout(function(){
        d.dispatchEvent(new w.KeyboardEvent("keydown",{key:"Escape",bubbles:true}));
        setTimeout(function(){
          L.push("");
          L.push("Escape -> drawer open: "+drawer.classList.contains("open"));
          L.push("Escape -> focus returned to: "+who()+(d.activeElement===btn?"  (correct)":"  <-- check"));
          L.push("body overflow restored: "+(d.body.style.overflow===""?"yes":"NO  <-- BUG"));
          document.getElementById("out").textContent=L.join("\n");
        },600);
      },300);
    },60);
  },3500);
});
</script></body></html>

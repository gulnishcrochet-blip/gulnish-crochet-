<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>perf one</title></head>
<body>
<pre id="out">running</pre>
<script>
var p=new URLSearchParams(location.search).get("page")||"index.html";
var f=document.createElement("iframe");
f.style.cssText="width:390px;height:844px;border:0";
f.src=p;
f.onload=function(){
  setTimeout(function(){
    var w=this.contentWindow;
    var nav=w.performance.getEntriesByType("navigation")[0]||{};
    var rs=w.performance.getEntriesByType("resource");
    var fcp=0;
    w.performance.getEntriesByType("paint").forEach(function(e){
      if(e.name==="first-contentful-paint") fcp=Math.round(e.startTime); });
    var imgs=rs.filter(function(r){return r.initiatorType==="img";});
    var lt=w.performance.getEntriesByType("longtask")||[];
    var txt=fcp+" | DCL "+Math.round(nav.domContentLoadedEventEnd||0)+
      " | load "+Math.round(nav.loadEventEnd||0)+
      " | reqs "+(rs.length+1)+
      " | imgReqs "+imgs.length+
      " | imgKB "+Math.round(imgs.reduce(function(a,r){return a+(r.transferSize||0);},0)/1024)+
      " | totalKB "+Math.round(rs.reduce(function(a,r){return a+(r.transferSize||0);},0)/1024)+
      " | longtasks "+lt.length;
    document.getElementById("out").textContent=txt;
  }.bind(this),9000);
};
document.body.appendChild(f);
</script></body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>a11y probe</title></head>
<body>
<iframe id="f" src="index.html" style="width:390px;height:844px;border:0"></iframe>
<pre id="out">waiting</pre>
<script>
document.getElementById("f").addEventListener("load", function(){
  var w=this.contentWindow,d=this.contentDocument,L=[];
  function who(){var e=d.activeElement;if(!e)return"none";return e.id||e.className||e.tagName;}
  function finish(){document.getElementById("out").textContent=L.join("\n");}
  setTimeout(function(){
    var btn=d.getElementById("bottomNavCart");
    L.push("bottomNavCart present: "+(btn?"yes":"NO"));
    L.push("aria-expanded before: "+btn.getAttribute("aria-expanded"));
    L.push("focus before open: "+who());
    btn.click();
    L.push("focus in same task as .click(): "+who()+"   (old code left it here)");
    setTimeout(function(){
      L.push("focus after 200ms: "+who());
      L.push("aria-expanded after: "+btn.getAttribute("aria-expanded"));
      L.push("drawer aria-hidden: "+d.getElementById("cartDrawer").getAttribute("aria-hidden"));
      var drawer=d.getElementById("cartDrawer");
      L.push("focus is INSIDE drawer: "+(drawer.contains(d.activeElement)?"yes":"NO  <-- BUG"));
      L.push("close btn computed visibility: "+
        (function(){var c=d.getElementById("cartClose");
          return c?getComputedStyle(c).visibility:"n/a";})());
      d.dispatchEvent(new w.KeyboardEvent("keydown",{key:"Escape",bubbles:true}));
      setTimeout(function(){
        L.push("");
        L.push("after Escape -> drawer open: "+drawer.classList.contains("open"));
        L.push("after Escape -> aria-expanded: "+btn.getAttribute("aria-expanded"));
        L.push("after Escape -> aria-hidden: "+drawer.getAttribute("aria-hidden"));
        L.push("after Escape -> focus: "+who()+(d.activeElement===btn?"  (returned to trigger, correct)":"  <-- check"));
        L.push("body overflow restored: "+(d.body.style.overflow===""?"yes":"NO  <-- BUG"));
        finish();
      },600);
    },200);
  },3500);
});
</script></body></html>

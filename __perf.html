<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="index.html" style="width:320px;height:900px;border:0"></iframe>
<pre id="out">x</pre>
<script>
document.getElementById("f").addEventListener("load",function(){
 var d=this.contentDocument,w=this.contentWindow,L=[];
 setTimeout(function(){
  [].slice.call(d.querySelectorAll(".site-footer a")).forEach(function(a){
    var r=d.createRange(); r.selectNodeContents(a);
    var h=r.getBoundingClientRect().height;
    var fs=w.getComputedStyle(a).fontSize;
    var b=a.getBoundingClientRect();
    if(h>24) L.push("WRAPS: '"+a.textContent.trim()+"'  textH="+Math.round(h)+" font="+fs+
                    " colW="+Math.round(b.width)+" scrollW="+a.scrollWidth);
  });
  if(!L.length) L.push("none wrap at 320px");
  document.getElementById("out").textContent=L.join("\n");
 },6000);
});
</script></body></html>

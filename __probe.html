
<script>
window.__errs=[]; window.__ran=false;
addEventListener("error",function(e){window.__errs.push(String(e.message).slice(0,80));});
addEventListener("load",function(){
  setTimeout(function(){
    try{
      var d=document, b=d.body, txt=(b.innerText||"").toLowerCase();
      var r={errs:window.__errs.slice(0,4)};
      r.gone={
        howItWorks: txt.indexOf("how it works")===-1,
        doorstep:   txt.indexOf("from idea to doorstep")===-1,
        stayLoop:   txt.indexOf("stay in the loop")===-1,
        notifyMe:   txt.indexOf("notify me")===-1,
        fourSteps:  txt.indexOf("four simple steps")===-1
      };
      r.wl={
        openBtn: d.querySelectorAll("[data-open-wishlist]").length,
        heart:   d.querySelectorAll("[data-wishlist-toggle]").length,
        badge:   d.querySelectorAll("[data-wl-count]").length,
        panel:   d.querySelectorAll(".wl-panel,.wl-overlay").length,
        api:     (typeof window.GulnishWishlist!=="undefined")
      };
      r.nl={form: d.querySelectorAll("[data-newsletter-form]").length,
            box: d.querySelectorAll(".newsletter").length};
      r.cards=d.querySelectorAll(".work-card").length;
      r.qv=d.querySelectorAll(".card-tool--qv").length;
      r.tools=d.querySelectorAll(".work-card__tools").length;
      r.heads=d.querySelectorAll("h1,h2").length;
      r.imgBroken=Array.prototype.filter.call(d.images,function(i){return i.complete&&i.naturalWidth===0;}).length;
      r.hscroll=d.documentElement.scrollWidth>window.innerWidth+1;
      r.scrollW=d.documentElement.scrollWidth; r.innerW=window.innerWidth;
      r.cssApplied=getComputedStyle(d.body).backgroundColor;
      d.title="RESULT"+JSON.stringify(r);
    }catch(e){document.title="RESULT"+JSON.stringify({fatal:String(e).slice(0,90)});}
  },2600);
});
</script>

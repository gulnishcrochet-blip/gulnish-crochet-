<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="site-header"><div class="container header-inner">
<a class="logo"><span class="logo-name">x</span></a>
<button class="cart-btn" id="cartToggle" aria-label="Open cart" aria-expanded="false">cart</button>
<button class="nav-toggle" id="navToggle" aria-label="Menu">M</button>
</div></header>
<section class="hero-collage"><div class="container"><div class="collage">
<a class="collage__panel collage__panel--hero"><div class="collage__art"><img src="images/purses/purse-1.webp"></div><div class="collage__body"><h1 class="collage__title">T</h1><p class="collage__text">x</p><span class="collage__cta">C</span></div></a>
<a class="collage__panel collage__panel--a"><div class="collage__art"><img src="images/bags/bag-1.webp"></div><div class="collage__body"><h2 class="collage__title">B</h2></div></a>
<a class="collage__panel collage__panel--b"><div class="collage__art"><img src="images/jewellery/jewellery-1.webp"></div><div class="collage__body"><h2 class="collage__title">J</h2></div></a>
</div></div></section>
<section class="value-strip"><div class="container"><div class="value-strip__inner">
<div class="value-item"><span class="value-item__icon"><svg viewBox="0 0 24 24"></svg></span><div><div class="value-item__title">Handmade to order</div><div class="value-item__text">Stitched after you order, never mass-produced</div></div></div>
<div class="value-item"><span class="value-item__icon"><svg viewBox="0 0 24 24"></svg></span><div><div class="value-item__title">Delivery</div><div class="value-item__text">Tracked shipping</div></div></div>
</div></div></section>
<section class="section"><div class="container"><div class="section-head"><span class="section-eyebrow">Shop</span><h2 class="section-title">T</h2><p class="section-lead">L</p></div>
<div class="image-grid">
<article class="work-card"><div class="work-card__media"><img class="work-card__main" src="images/purses/purse-1.webp"></div><div class="work-card__body"><h3 class="work-card__name">Handmade Crochet Flower Bouquet With Silk Wrap And Custom Colours</h3><div class="work-card__price">Rs. 2,450</div><button class="add-btn">Add to cart</button></div></article>
<article class="work-card"><div class="work-card__media"><img class="work-card__main" src="images/bags/bag-1.webp"></div><div class="work-card__body"><h3 class="work-card__name">Short</h3><div class="work-card__price">Rs. 900</div><button class="add-btn">Add to cart</button></div></article>
</div><button class="btn">Confirm order</button></div></section>
<nav class="bottom-nav"><button class="bottom-nav__item" id="bottomNavCart" aria-label="Open cart">cart</button></nav>
<pre id="out"></pre>
<script>
function cs(sel,props){var el=document.querySelector(sel);if(!el)return sel+" :: MISSING";
  var s=getComputedStyle(el);return sel+" :: "+props.map(function(p){return p+"="+s[p];}).join(" | ");}
var cards=[].slice.call(document.querySelectorAll(".work-card")).map(function(c){return c.offsetHeight;});
var L=[
 "viewport="+window.innerWidth+"x"+window.innerHeight,
 cs(".site-header .cart-btn",["display"]),
 cs("#bottomNavCart",["display"]),
 cs(".work-card",["box-shadow","border-color"]),
 cs(".work-card__name",["font-size","line-height","-webkit-line-clamp"]),
 cs(".work-card__body",["gap","padding"]),
 cs(".image-grid",["gap","grid-template-columns"]),
 cs(".value-strip__inner",["grid-template-columns"]),
 cs(".collage__panel--hero",["min-height"]),
 cs(".btn",["box-shadow"]),
 "card heights (must match): "+cards.join(" vs "),
 "hover-lift neutralised: "+ (getComputedStyle(document.querySelector(".work-card")).getPropertyValue("--x")||"n/a")
];
document.getElementById("out").textContent=L.join("\n");
</script></body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"></head>
<body><iframe id="f" src="index.html" style="width:390px;height:844px;border:0"></iframe><pre id="out"></pre>
<script>
document.getElementById("f").addEventListener("load", function () {
  setTimeout(function () {
    var w = this.contentWindow, d = this.contentDocument, L = [];
    function rect(el){ if(!el) return null; var r = el.getBoundingClientRect(); return (r.width||r.height) ? r : null; }

    var headerCart  = d.getElementById("cartToggle");
    var bottomCart = d.getElementById("bottomNavCart");
    L.push("header cart visible rect: " + (rect(headerCart) ? "yes" : "NO (hidden)"));
    L.push("bottom cart visible rect: " + (rect(bottomCart) ? "yes" : "NO (hidden)"));

    // mirror of flyToCart()'s target resolution
    var chosen = rect(headerCart) ? headerCart : bottomCart;
    L.push("flyToCart would target: " + (chosen === bottomCart ? "bottom-nav cart (correct)" : "header cart"));

    // open the drawer via the bottom-nav control
    bottomCart.click();
    var drawer = d.getElementById("cartDrawer");
    L.push("drawer open after bottom-nav tap: " + drawer.classList.contains("open"));
    L.push("aria-expanded header=" + headerCart.getAttribute("aria-expanded") +
           " bottom=" + bottomCart.getAttribute("aria-expanded"));
    L.push("focus went to close button: " + (d.activeElement && d.activeElement.id === "cartClose"));

    // close it and confirm focus returns somewhere focusable
    d.getElementById("cartClose").click();
    L.push("drawer open after close: " + drawer.classList.contains("open"));
    L.push("aria-expanded after close: header=" + headerCart.getAttribute("aria-expanded") +
           " bottom=" + bottomCart.getAttribute("aria-expanded"));
    var a = d.activeElement;
    L.push("focus returned to: " + (a ? (a.id || a.tagName) : "nothing") +
           " (visible=" + (rect(a) ? "yes" : "NO - focus lost") + ")");

    document.getElementById("out").textContent = L.join("\n");
  }.bind(this), 3500);
});
</script></body></html>
